name: Android CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # caches ~/.npm between runs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # RN 0.86 needs 17 — not 11
          distribution: 'temurin'

      # Done FIRST, before npm and prebuild, so a bad keystore fails in ~30
      # seconds instead of 32 minutes into Gradle. It decodes to RUNNER_TEMP
      # rather than android/app/ because android/ doesn't exist until prebuild.
      #
      # `tr -d` strips newlines a copy-paste may have added — a wrapped secret
      # decodes to garbage, which Gradle then reports as a key alias error.
      - name: Inject and verify signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "${KEYSTORE_B64}" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.keystore"

          echo "--- What is actually inside the keystore ---"
          # No -alias here on purpose: this dumps EVERY entry. GitHub masks any
          # text matching a secret, so read the output like this —
          #   alias prints as ***          -> secret matches, look elsewhere
          #   alias prints in plain text   -> ANDROID_KEY_ALIAS is wrong, and
          #                                   the name you see is the right one
          keytool -list -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            | grep -E "Alias name|SHA256:" \
            || { echo "::error::Keystore did not open at all — ANDROID_KEYSTORE_BASE64 is corrupt or ANDROID_KEYSTORE_PASSWORD is wrong."; exit 1; }

          echo "--- Confirming ANDROID_KEY_ALIAS resolves ---"
          keytool -list \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            || { echo "::error::ANDROID_KEY_ALIAS is not in this keystore. Compare it with the 'Alias name' printed above."; exit 1; }

      # `npm ci`, not `npm install`: installs exactly what package-lock.json
      # says, and fails loudly if the lockfile is out of sync.
      - name: Install dependencies
        run: npm ci

      # This project's stand-in for the unit tests your other app runs.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # EXPO_PUBLIC_* variables are inlined into the JS bundle at build time,
      # so the file must exist before the bundler runs. This is the Expo
      # equivalent of injecting keys into local.properties.
      - name: Inject API keys into .env
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          ALGOLIA_APP_ID: ${{ secrets.EXPO_PUBLIC_ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_KEY: ${{ secrets.EXPO_PUBLIC_ALGOLIA_SEARCH_KEY }}
          ALGOLIA_PRODUCTS_INDEX: ${{ secrets.EXPO_PUBLIC_ALGOLIA_PRODUCTS_INDEX }}
          ALGOLIA_POSTS_INDEX: ${{ secrets.EXPO_PUBLIC_ALGOLIA_POSTS_INDEX }}
        run: |
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=${SUPABASE_URL}"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "EXPO_PUBLIC_ALGOLIA_APP_ID=${ALGOLIA_APP_ID}"
            echo "EXPO_PUBLIC_ALGOLIA_SEARCH_KEY=${ALGOLIA_SEARCH_KEY}"
            echo "EXPO_PUBLIC_ALGOLIA_PRODUCTS_INDEX=${ALGOLIA_PRODUCTS_INDEX}"
            echo "EXPO_PUBLIC_ALGOLIA_POSTS_INDEX=${ALGOLIA_POSTS_INDEX}"
          } >> .env

          # A missing secret is an empty string, not an error — the build would
          # otherwise succeed and ship an APK that can't reach Supabase.
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Supabase secrets are missing. Check repo Settings → Secrets."
            exit 1
          fi

      # THE STEP THAT DOESN'T EXIST IN A NATIVE PROJECT.
      # /android is git-ignored in an Expo app, so CI generates it from
      # app.json + app.config.js. --no-install because npm ci already ran.
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      # After prebuild — there is no Gradle project to cache before it.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # Signing is passed as Gradle properties rather than by editing
      # build.gradle — prebuild regenerates that file, so any edit would be
      # thrown away on the next run. The keystore path is the one verified at
      # the top of this job.
      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

      # Only main reaches your testers — every other branch still builds and
      # leaves a downloadable APK above. (Your other app used stable1.0.)
      - name: Upload to Firebase App Distribution
        if: github.ref == 'refs/heads/main'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          # A service account, NOT the FIREBASE_TOKEN your other app uses —
          # that method is deprecated and tied to a personal Google account.
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: |
            ${{ github.event.head_commit.message || 'Manual build' }}

            Build #${{ github.run_number }} · ${{ github.sha }}
